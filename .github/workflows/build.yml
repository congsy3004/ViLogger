name: Build

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test EverLogger.sln -c Release

      - name: Publish single-file exe
        shell: pwsh
        run: |
          dotnet publish src/EverLogger.App/EverLogger.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -o publish

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARVSerialTool-win-x64
          path: publish/ARVSerialTool.exe
          retention-days: 14
